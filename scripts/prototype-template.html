<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />
<title>/*[|template_title|]*/0 | Cincotree</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<style>
:root {
  --primary: #29496a;
  --primary-dark: #1e3a54;
  --ink: #171717;
  --muted: #4b5563;
  --line: #e5e7eb;
  --error: #b42318;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
.wrap { width: 100%; max-width: 64rem; margin: 0 auto; padding: 0 1.5rem; }

.nav { border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 1.5rem; }
.nav img { height: 3.5rem; width: auto; display: block; }

.hero { background: var(--primary); color: #fff; padding-block: 4rem; }
.eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.65); margin: 0; }
.hero h1 { margin: 0.75rem 0 0; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
.hero p { margin: 1rem 0 0; max-width: 36rem; font-size: 1.0625rem; line-height: 1.6; color: rgba(255,255,255,0.8); }

main { flex: 1; padding-block: 3.5rem 5rem; }
form { max-width: 26rem; }
label.field { display: block; font-size: 0.875rem; font-weight: 600; color: #111827; }
.input { position: relative; margin-top: 0.5rem; }
.input input {
  width: 100%;
  padding: 0.75rem 3rem 0.75rem 0.875rem;
  font: inherit;
  font-size: 1rem;
  color: var(--ink);
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  background: #fff;
}
.input input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }
.input.invalid input { border-color: var(--error); }
.toggle {
  position: absolute; top: 50%; right: 0.5rem; transform: translateY(-50%);
  width: 2.25rem; height: 2.25rem; padding: 0.5rem;
  border: 0; background: none; cursor: pointer; color: #6b7280; border-radius: 0.25rem;
}
.toggle:hover { color: var(--primary); }
.toggle svg { width: 100%; height: 100%; display: block; }
.error { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--error); }
.remember { display: flex; align-items: center; gap: 0.5rem; margin-top: 1.25rem; font-size: 0.875rem; color: var(--muted); cursor: pointer; }
.remember input { width: 1rem; height: 1rem; accent-color: var(--primary); margin: 0; }
button.submit {
  margin-top: 1.75rem;
  padding: 0.75rem 1.5rem;
  font: inherit; font-size: 0.875rem; font-weight: 500;
  color: #fff; background: var(--primary);
  border: 0; border-radius: 0.375rem; cursor: pointer;
}
button.submit:hover { background: var(--primary-dark); }
button.submit:disabled { opacity: 0.7; cursor: progress; }
.loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.spinner { width: 2rem; height: 2rem; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="staticrypt_loading" class="loading"><div class="spinner"></div></div>

<div id="staticrypt_content" class="hidden" style="display:flex;flex-direction:column;min-height:100vh">
  <nav class="nav">
    <div class="wrap">
      <a href="/"><img src="/cincotree-logo.png" alt="Cincotree" width="194" height="56" /></a>
    </div>
  </nav>

  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">Private prototype</p>
      <h1>/*[|template_title|]*/0</h1>
      <p>/*[|template_instructions|]*/0</p>
    </div>
  </section>

  <main>
    <div class="wrap">
      <form id="staticrypt-form" action="#" method="post" novalidate>
        <label class="field" for="staticrypt-password">Password</label>
        <div class="input" id="staticrypt-input">
          <input id="staticrypt-password" type="password" name="password" autocomplete="current-password" required aria-describedby="staticrypt-error" />
          <button type="button" class="toggle" id="staticrypt-toggle" aria-label="Show password" title="Show password">
            <svg id="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="icon-hide" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.6M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
          </button>
        </div>
        <p class="error hidden" id="staticrypt-error" role="alert">That password did not work. Check it and try again.</p>

        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" />
          Remember me on this device for 30 days
        </label>

        <button type="submit" class="submit" id="staticrypt-submit">View prototype</button>
      </form>
    </div>
  </main>
</div>

<script>
const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
const isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
  staticryptConfig = /*[|staticrypt_config|]*/ 0;

const pageKey = location.pathname.replace(/\/index\.html$/, "/");
const staticrypt = staticryptInitiator.init(staticryptConfig, {
  rememberExpirationKey: "staticrypt_expiration:" + pageKey,
  rememberPassphraseKey: "staticrypt_passphrase:" + pageKey,
  replaceHtmlCallback: null,
  clearLocalStorageCallback: null,
});

const passwordInput = document.getElementById("staticrypt-password");
const inputWrap = document.getElementById("staticrypt-input");
const errorText = document.getElementById("staticrypt-error");
const submitButton = document.getElementById("staticrypt-submit");
const toggle = document.getElementById("staticrypt-toggle");

window.onload = async function () {
  const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
  if (!isSuccessful) {
    document.getElementById("staticrypt_loading").classList.add("hidden");
    document.getElementById("staticrypt_content").classList.remove("hidden");
    if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
    passwordInput.focus();
  }
};

toggle.addEventListener("click", function () {
  const show = passwordInput.type === "password";
  passwordInput.type = show ? "text" : "password";
  document.getElementById("icon-show").classList.toggle("hidden", show);
  document.getElementById("icon-hide").classList.toggle("hidden", !show);
  const label = show ? "Hide password" : "Show password";
  toggle.setAttribute("aria-label", label);
  toggle.title = label;
  passwordInput.focus();
});

passwordInput.addEventListener("input", function () {
  errorText.classList.add("hidden");
  inputWrap.classList.remove("invalid");
  passwordInput.removeAttribute("aria-invalid");
});

document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  if (!passwordInput.value) {
    passwordInput.focus();
    return;
  }
  submitButton.disabled = true;
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(
    passwordInput.value,
    document.getElementById("staticrypt-remember").checked
  );
  if (!isSuccessful) {
    submitButton.disabled = false;
    errorText.classList.remove("hidden");
    inputWrap.classList.add("invalid");
    passwordInput.setAttribute("aria-invalid", "true");
    passwordInput.select();
  }
});
</script>
</body>
</html>
